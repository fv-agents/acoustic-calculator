name: Keep-alive calculator auth project

# Supabase's free tier pauses a project after ~7 days zonder database-activiteit.
# Deze workflow pingt het geïsoleerde calculator-auth-project (lumenear-calculator-auth,
# bevat GEEN AIF-data) dagelijks, zodat het nooit pauzeert terwijl de calculator
# maar af en toe gebruikt wordt. Zie decisions.md 2026-07-17 (3).
#
# LET OP: eerdere versie pingte /auth/v1/settings — dat is een statische GoTrue-config
# endpoint die de Postgres-database nooit raakt, dus telde niet mee als activiteit.
# Project pauzeerde alsnog op 2026-08-12 ondanks 7 dagen "success" runs.
# Fix: een echte INSERT op calculator_access_log (insert-only anon-policy, zelfde
# tabel/schema als app/auth.js logCalculatorLogin) — dat raakt Postgres wel.

on:
  schedule:
    - cron: "0 6 * * *"   # dagelijks 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    name: Keep-alive insert via PostgREST
    runs-on: ubuntu-latest
    steps:
      - name: Insert keep-alive row
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            -X POST "https://yclomlaxufhnfsqwougx.supabase.co/rest/v1/calculator_access_log" \
            -H "apikey: sb_publishable_FwIKHltiOyi3lF4iiOvgCg_tDF8TPdt" \
            -H "Authorization: Bearer sb_publishable_FwIKHltiOyi3lF4iiOvgCg_tDF8TPdt" \
            -H "Content-Type: application/json" \
            -d '{"username":"keep-alive-ping","user_agent":"github-actions-keep-alive"}'
